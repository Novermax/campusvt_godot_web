<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusVT</title>
<style>body { background: #000; color: #e0e0e0; font: 1.4rem Arial, sans-serif; display: flex; height: 100vh; margin: 0; align-items: center; justify-content: center; }</style>
</head>
<body>
<p id="msg">Avvio…</p>
<script>
// Rimanda all'ultima build (vedi tools/build_web.sh): latest.txt si legge
// sempre fresco, così un aggiornamento arriva subito anche al visore.
fetch('latest.txt?n=' + Date.now(), { cache: 'no-store' })
	.then((r) => r.ok ? r.text() : Promise.reject(new Error(r.status)))
	.then((build) => location.replace(build.trim() + '/' + location.search))
	.catch((e) => { document.getElementById('msg').textContent = 'Sito non raggiungibile (' + e.message + ').'; });
</script>
</body>
</html>
